<template>
    <div class="slds-box slds-theme_default slds-p-around_large main-container">
        
        <template if:true={error}>
            <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                <h2>{error}</h2>
            </div>
        </template>

        <template if:false={fileData}>
            <template if:false={error}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>
        </template>

        <template if:true={fileData}>
            <div class="slds-text-align_center slds-m-bottom_medium">
                <h2 class="slds-text-heading_medium"><strong>Review Design</strong></h2>
                <p class="slds-text-color_weak slds-m-top_xx-small">
                    Please review the file sent to your email and provide your decision below.
                </p>
            </div>

            <div class="file-card slds-card slds-p-around_large slds-align_absolute-center slds-text-align_center">
                <div class="slds-grid slds-grid_vertical slds-align_absolute-center" style="width:100%">
                    
                    <div class="slds-m-bottom_medium">
                        <lightning-icon icon-name="doctype:attachment" size="medium" class="slds-m-right_small"></lightning-icon>
                        <span class="slds-text-heading_small"><strong>{fileData.title}</strong></span>
                    </div>

                    <template if:true={isFinalized}>
                        <div class={statusBadgeClass}>
                            Status: {fileData.status}
                        </div>
                        <template if:true={fileData.comments}>
                            <p class="slds-m-top_small slds-text-color_weak">"{fileData.comments}"</p>
                        </template>
                    </template>

                    <template if:false={isFinalized}>
                        <div class="slds-grid slds-gutters slds-m-top_medium">
                            <div class="slds-col">
                                <lightning-button 
                                    variant="success" 
                                    label="Approve" 
                                    icon-name="utility:check" 
                                    onclick={handleApprove} 
                                    class="action-btn">
                                </lightning-button>
                            </div>
                            <div class="slds-col">
                                <lightning-button 
                                    variant="destructive" 
                                    label="Request Changes" 
                                    icon-name="utility:close" 
                                    onclick={toggleComments} 
                                    class="action-btn">
                                </lightning-button>
                            </div>
                        </div>

                        <template if:true={showCommentBox}>
                            <div class="slds-m-top_medium slds-text-align_left" style="width: 100%;">
                                <lightning-textarea 
                                    label="Please describe the changes needed:" 
                                    value={comments} 
                                    onchange={handleCommentChange}
                                    required>
                                </lightning-textarea>
                                <lightning-button 
                                    variant="brand" 
                                    label="Submit Changes" 
                                    onclick={handleSubmitChanges} 
                                    class="slds-m-top_small slds-float_right">
                                </lightning-button>
                            </div>
                        </template>
                    </template>

                </div>
            </div>
        </template>
    </div>
</template>
