<template>
  <section class="contact-section">
    <div class="container">
      <!-- Heading -->
      <div class="intro">
        <h2 class="heading">Let's Start a Conversation</h2>
        <p class="lead">
          Whether you have a clear vision or need guidance, our team is here to help
          you create spaces that inspire and delight.
        </p>
      </div>

      <!-- Contact Details Grid -->
      <div class="cards">
        <template for:each={contactDetails} for:item="detail">
          <div key={detail.title} class="card">
            <!-- SVG Icon -->
            <div class="icon-box">
              <span class="icon" lwc:dom="manual" data-key={detail.title}></span>
            </div>

            <!-- Text Block -->
            <div class="card-body">
              <div class="card-title">{detail.title}</div>

              <!-- Lines (fixed key = line) -->
              <template for:each={detail.lines} for:item="line">
                <p key={line} class="card-text">{line}</p>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- Social Links -->
      <div class="follow">
        <hr class="divider" />

        <div class="follow-inner">
          <p class="follow-title">Follow Our Work</p>

          <div class="social">
            <template for:each={socialLinks} for:item="s">
              <a
                key={s.label}
                href={s.href}
                target="_blank"
                rel="noopener"
                class="social-btn"
                title={s.label}
              >
                <span class="social-icon" lwc:dom="manual" data-key={s.label}></span>
              </a>
            </template>
          </div>
        </div>
      </div>

      <!-- Trust Badge -->
      
    </div>
  </section>
</template>
