<template>
    <lightning-quick-action-panel header="Assign Multiple Tasks">
        <div class="slds-scrollable_y" style="max-height: 400px;">
            <template for:each={taskList} for:item="task" for:index="index">
                <div key={task.key} class="slds-box slds-m-bottom_small slds-theme_shade">
                    
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                        <h3 class="slds-text-heading_small">Task </h3>
                        <lightning-button-icon icon-name="utility:delete" 
                                               variant="bare" 
                                               alternative-text="Remove" 
                                               title="Remove" 
                                               data-index={index}
                                               onclick={removeRow}
                                               if:true={isMoreThanOneRow}>
                        </lightning-button-icon>
                    </div>

                    <lightning-layout multiple-rows>
                        <lightning-layout-item size="12" small-device-size="6" padding="horizontal-small">
                            <lightning-input label="Subject" 
                                             value={task.Subject} 
                                             data-index={index} 
                                             data-field="Subject" 
                                             onchange={handleInputChange}
                                             required>
                            </lightning-input>
                        </lightning-layout-item>

                        <lightning-layout-item size="12" small-device-size="6" padding="horizontal-small">
                            <lightning-combobox label="Status"
                                                value={task.Status}
                                                options={statusOptions}
                                                data-index={index} 
                                                data-field="Status" 
                                                onchange={handleInputChange}
                                                 required>
                            </lightning-combobox>
                        </lightning-layout-item>

                        <lightning-layout-item size="12" small-device-size="4" padding="horizontal-small">
                            <lightning-input type="date" 
                                             label="Start Date" 
                                             value={task.Start_Date__c} 
                                             data-index={index} 
                                             data-field="Start_Date__c" 
                                             onchange={handleInputChange}
                                              required>
                            </lightning-input>
                        </lightning-layout-item>

                        <lightning-layout-item size="12" small-device-size="4" padding="horizontal-small">
                            <lightning-input type="date" 
                                             label="Due Date" 
                                             value={task.ActivityDate} 
                                             data-index={index} 
                                             data-field="ActivityDate" 
                                             onchange={handleInputChange}
                                              required>
                            </lightning-input>
                        </lightning-layout-item>

                        <lightning-layout-item size="12" small-device-size="4" padding="horizontal-small">
                            <lightning-input type="number" 
                                             label="Assigned %" 
                                             value={task.Assigned_Percentage__c} 
                                             data-index={index} 
                                             data-field="Assigned_Percentage__c" 
                                             onchange={handleInputChange}
                                             formatter="percent-fixed"
                                             step="0.01">
                            </lightning-input>
                        </lightning-layout-item>
                    </lightning-layout>
                </div>
            </template>
            
            <div class="slds-align_absolute-center slds-m-top_small">
                <lightning-button label="Add Another Task" 
                                  icon-name="utility:add" 
                                  onclick={addNewRow}>
                </lightning-button>
            </div>
        </div>

        <div slot="footer">
            <lightning-button variant="neutral" label="Cancel" onclick={closeAction} class="slds-m-right_small"></lightning-button>
            <lightning-button variant="brand" label="Save Tasks" onclick={handleSave} disabled={isSaving}></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
