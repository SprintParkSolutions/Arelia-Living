<template>
    <div class="slds-box slds-theme_default main-container">
        
        <div class="upload-section slds-p-around_medium slds-m-bottom_medium">
            <h2 class="slds-text-heading_medium slds-text-align_center slds-m-bottom_small">
                <strong>Upload Architecture Design</strong>
            </h2>
            
            <div class="upload-zone slds-align_absolute-center slds-p-around_large">
                <div class="slds-text-align_center">
                    <lightning-icon icon-name="utility:upload" size="large" class="slds-m-bottom_small"></lightning-icon>
                    <lightning-file-upload
                        label="Select Design File"
                        name="fileUploader"
                        record-id={recordId}
                        accept={acceptedFormats}
                        onuploadfinished={handleUploadFinished}>
                    </lightning-file-upload>
                    <p class="slds-text-color_weak slds-m-top_x-small">Supports PDF, JPG, PNG</p>
                </div>
            </div>

            <template if:true={uploadedFileId}>
                <div class="slds-text-align_center slds-m-top_medium">
                    <p class="slds-m-bottom_small slds-text-color_success">File Uploaded! Ready to send.</p>
                    <lightning-button 
                        variant="brand" 
                        label="Send to Client" 
                        icon-name="utility:email"
                        onclick={handleSendClick}
                        disabled={isLoading}>
                    </lightning-button>
                </div>
            </template>
        </div>

        <div class="history-section slds-border_top slds-p-top_medium">
            <h3 class="slds-text-heading_small slds-m-bottom_small slds-p-left_small">
                <strong>Architecture Submission History</strong>
            </h3>
            
            <template if:true={files}>
                <div class="slds-scrollable_y" style="max-height: 250px;">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col">Design Name</th>
                                <th scope="col">Type</th>
                                <th scope="col">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={files} for:item="file">
                                <tr key={file.id}>
                                    <td data-label="Design Name">
                                        <div class="slds-truncate" title={file.title}>{file.title}</div>
                                    </td>
                                    <td data-label="Type">
                                        <div class="slds-truncate">{file.extension}</div>
                                    </td>
                                    <td data-label="Status">
                                        <span class={file.statusClass}>{file.status}</span>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <template if:false={files}>
                <p class="slds-text-align_center slds-text-color_weak slds-p-around_medium">No designs uploaded yet.</p>
            </template>
        </div>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

    </div>
</template>
