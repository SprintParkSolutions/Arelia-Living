<template>
    <section class="why-section">
        <div class="heading-wrapper">
            <h2 class="section-title">WHY CHOOSE OUR EXPERTISE</h2>
            <div class="section-underline"></div>
        </div>

        <div class="hex-grid">
            <template for:each={benefits} for:item="item" for:index="index">
                <article key={item.id} class="hex-card">
                    <div class="hex-inner">
                        <div class="hex-icon">
                            <span>{item.icon}</span>
                        </div>
                        <h3 class="hex-heading">{item.title}</h3>
                        <p class="hex-text">{item.description}</p>
                    </div>
                </article>
            </template>
        </div>
    </section>
</template>
